layer-cos.yaml
```
name: cos
type: juju_kubernetes_workload
parent: existing_juju_maas_controller_k8s
features: []
config:
  bundle_options:
    series: jammy
  offers:
  - application: alertmanager
    endpoints:
    - karma-dashboard
  - application: prometheus
    endpoints:
    - metrics-endpoint
    - receive-remote-write
  - application: grafana
    endpoints:
    - grafana-dashboard
  - application: loki
    endpoints:
    - logging
  - application: scrape-interval-config-metrics
    endpoints:
    - configurable-scrape-jobs
  - application: scrape-interval-config-monitors
    endpoints:
    - configurable-scrape-jobs
  juju_model: cos
  build_bundle: false
  #model_config: {}
  trust_bundle: true
  retry_error_count: 5
  bundles:
  - ../common/bundle-cos.yaml
  - ../common/overlay-cos-storage.yaml
  - ../common/overlay-cos-offers.yaml
  # - ../common/overlay-cos-certificates.yaml
  wait_exclude:
  - scrape-interval-config-metrics
  - scrape-intedrval-config-monitors
```


